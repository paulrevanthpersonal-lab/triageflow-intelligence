name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python scripts/generate_dataset.py
      - run: ruff check app scripts tests
      - run: pytest
      - run: python -m compileall -q app scripts tests
      - name: Enforce model quality floor
        run: python -c "from app.ml import train; m=train(force=True).metrics; assert m['category_macro_f1'] >= .80 and m['priority_macro_f1'] >= .80, m"
